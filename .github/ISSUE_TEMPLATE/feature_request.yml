name: Feature request
description: Suggest a new capability or prop
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would you like to use it? A code sample helps.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
